[project]
name = "seiskit"
version = "0.1.0"
description = "This project is for OpenSees study on spatial variability in soil wave propagation."
authors = [
    { name = "Kurt Walter Soncco Sinchi", email = "kurtwal98@berkeley.edu" },
]
# Narrows the compatible Python versions to prevent future errors
requires-python = ">=3.10" 
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "openseespy",
    "xara",
    "plotly",
    "kaleido",
    "joblib",
    "mpi4py",
    "markupsafe==2.1.3",
    "torch",
    "wandb",
    "tqdm",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
packages = ["seiskit"]

[tool.pytest.ini_options]
pythonpath = ["."]


[tool.uv]
package = true
extra-index-url = ["https://download.pytorch.org/whl/cu121"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]

[project.urls]
"Homepage" = "https://example.invalid/"

