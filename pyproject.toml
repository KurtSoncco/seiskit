[project]
name = "seiskit"
version = "0.1.0"
description = "This project is for OpenSees study on spatial variability in soil wave propagation."
authors = [
    { name = "Kurt Walter Soncco Sinchi", email = "kurtwal98@berkeley.edu" },
]
# Narrows the compatible Python versions to prevent future errors
requires-python = ">=3.10" 
dependencies = [
    "numpy",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "openseespy",
    "joblib",
    "numba",
    "matplotlib",
    "seaborn",
    "plotly",
    "pandas",
    "pyarrow",
    "h5py",
    "hdf5plugin",
    "tqdm",
    "paramiko",
    "cmcrameri",
]

[project.optional-dependencies]
analysis = [
    "kerchunk",
    "zarr",
    "xarray",
    "fsspec",
    "ujson",
    "pyarrow",
    "cmcrameri"
]
ml = [
    "xgboost",
    "shap",
    "interpret",
    "ngboost",
    "pygam",
    "bambi",
    "arviz",
    "pymc>=5.10",
]
notebook = [
    "ipykernel",
    "kaleido",
]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
packages = ["seiskit", "seiskit.plot_config"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length; can tighten later


[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]

[project.urls]
"Homepage" = "https://example.invalid/"

