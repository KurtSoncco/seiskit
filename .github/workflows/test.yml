name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: 3.11

    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Lint with ruff
      run: |
        uv run ruff check seiskit tests
        uv run ruff format --check seiskit tests

    - name: Run tests with pytest
      run: |
        uv run pytest tests/ -v --cov=seiskit --cov-report=xml --cov-report=term-missing

    # Coverage upload; fail_ci_if_error is intentionally false so CI does not fail on Codecov service issues
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
